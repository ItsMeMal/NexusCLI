name: Agent Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nexus CLI
        run: npm install -g nexus-cli

      - name: Run agent review
        env:
          BASE_URL: ${{ secrets.LLM_BASE_URL }}
          API_KEY: ${{ secrets.LLM_API_KEY }}
          MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o' }}
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- '*.js' '*.mjs' '*.ts' '*.tsx' | head -c 30000)
          PROMPT="Review this PR diff for bugs, security issues, and code quality. Be concise. Output markdown.

          \`\`\`diff
          ${DIFF}
          \`\`\`"

          nexus run "${PROMPT}" --json --approve --mode plan > review.json 2>&1 || true

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '🤖 **Nexus Agent Review**\n\nAgent could not produce a review.';
            try {
              const raw = fs.readFileSync('review.json', 'utf8');
              const result = JSON.parse(raw);
              if (result.response) {
                body = `🤖 **Nexus Agent Review**\n\n${result.response}`;
              }
              if (result.error) {
                body += `\n\n⚠️ Error: ${result.error}`;
              }
            } catch (e) {
              body += `\n\nParse error: ${e.message}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000)
            });
